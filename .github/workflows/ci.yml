name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: farmcore
          POSTGRES_USER: farmcore
          POSTGRES_PASSWORD: farmcore
        ports:
          - 55442:5432
        options: >-
          --health-cmd "pg_isready -U farmcore -d farmcore"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.16"
      - run: uv sync --frozen --python 3.12
      - name: Lint, format and tests (without the slower dataset tests)
        run: bash scripts/check.sh
        env:
          PYTEST_ADDOPTS: "-m 'not data' -rs"
      - name: Audit runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --output-file requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/core/*.mjs tests/apps/fields/*.mjs

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t farmcore:ci .
