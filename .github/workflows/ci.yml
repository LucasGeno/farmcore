name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every test except the dataset and Compose ones, with the backup, restore and upgrade tests
  # required to run: a missing age or pg_dump 17 fails the job instead of skipping them.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PG_BINDIR: /usr/lib/postgresql/17/bin
      FARMCORE_REQUIRE_TOOLS: "1"
    services:
      db: &db
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: farmcore
          POSTGRES_USER: farmcore
          POSTGRES_PASSWORD: farmcore
        ports:
          - 55442:5432
        options: >-
          --health-cmd "pg_isready -U farmcore -d farmcore"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/backup-tools
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.16"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --python 3.12
      - name: Lint, format and tests (without the dataset and Compose tests)
        shell: bash
        run: bash scripts/check.sh 2>&1 | tee pytest.log
        env:
          PYTEST_ADDOPTS: "-m 'not data and not slow' -rs --durations=25"
      - name: Fail if a test skipped for a missing tool
        shell: bash
        run: &no-tool-skips |
          if grep -E '^SKIPPED .*(needs the age CLI|needs pg_dump|needs a Docker daemon|needs Docker)' pytest.log; then
            echo "::error::tests skipped for a missing tool (see above)"
            exit 1
          fi
      - name: Audit runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --output-file requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip

  # The Compose journeys and other `slow` tests, serially, on a fresh Docker network pool.
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PG_BINDIR: /usr/lib/postgresql/17/bin
      FARMCORE_REQUIRE_TOOLS: "1"
    services:
      db: *db
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/backup-tools
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.16"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --python 3.12
      - name: Free Docker networks left by earlier projects
        run: docker network prune -f
      - name: Slow tests
        shell: bash
        run: uv run pytest -q -m slow -rs --durations=25 2>&1 | tee pytest.log
      - name: Fail if a test skipped for a missing tool
        shell: bash
        run: *no-tool-skips

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --test tests/core/*.mjs tests/apps/fields/*.mjs

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: farmcore:ci
          cache-from: type=gha,scope=farmcore-image
          cache-to: type=gha,scope=farmcore-image,mode=max
