# Alembic config for `uv run alembic ...` from the repo root. `farmcore migrate` builds the same
# config in code (farmcore.core.commands.migrate.alembic_config). The database URL comes from
# settings (DATABASE_URL) or `-x url=...`; it is never stored here.
[alembic]
script_location = %(here)s/src/farmcore/migrations
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
