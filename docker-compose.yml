# Self-hosted FarmCore: web app, optional Telegram bot, PostgreSQL + PostGIS and a daily backup.
#
#   cp .env.example .env      # set the three secrets (see docs/self-hosting.md)
#   docker compose up -d --build
#   docker compose exec app farmcore farms create "My farm"   # or, optional: the demo farm
#   docker compose exec app farmcore seed --scene B
#   docker compose --profile telegram up -d            # also start the bot
#
# One installation = one Compose project. Several on one host: give each its own project name
# and env file (`docker compose -p farm-a --env-file farm-a.env up -d`); containers, network,
# volumes, image tag and cookies are then all per project. See docs/self-hosting.md.
#
# The app listens on 127.0.0.1:8000 by default; put a TLS-terminating reverse proxy in front.
# Never paste `docker compose config` output anywhere: it inlines .env values.

x-farmcore: &farmcore
  build: .
  # Per project unless FARMCORE_IMAGE names a release: rebuilding one installation never
  # swaps the image under another.
  image: ${FARMCORE_IMAGE:-farmcore-${COMPOSE_PROJECT_NAME}:local}
  restart: unless-stopped
  depends_on: &after-migrate
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  environment: &farmcore-env
    # The DML-only runtime role: it cannot change the schema, create roles or databases.
    DATABASE_URL: postgresql+psycopg://farmcore_app:${RUNTIME_DATABASE_PASSWORD:?set RUNTIME_DATABASE_PASSWORD in .env}@db:5432/farmcore
    ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env (openssl rand -hex 24)}
    # Refuse to start without a strong ADMIN_TOKEN; turn off the interactive API docs.
    FARMCORE_PUBLIC: "1"
    DEMO_MODE: ${DEMO_MODE:-false}
    DEMO_FARM_IDS: "${DEMO_FARM_IDS:-[]}"
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    DISPLAY_TZ: ${DISPLAY_TZ:-Europe/Paris}
    CLOCK_MODE: ${CLOCK_MODE:-replay}
    REPLAY_START: ${REPLAY_START:-}
    DEFAULT_FARM_KEY: ${DEFAULT_FARM_KEY:-}
    FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    EXTRACTOR: ${EXTRACTOR:-regex}
    VERTEX_PROJECT: ${VERTEX_PROJECT:-}
    VERTEX_LOCATION: ${VERTEX_LOCATION:-europe-west4}
    VERTEX_AUTH: ${VERTEX_AUTH:-adc}
    VERTEX_MODEL: ${VERTEX_MODEL:-}
    VERTEX_HOST: ${VERTEX_HOST:-}
    WHISPER_MODEL: ${WHISPER_MODEL:-}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
  volumes:
    # This installation's Whisper model cache (voice notes): downloads once, about 460 MB.
    - whisper-cache:/home/farmcore/.cache/huggingface
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: ${POSTGIS_IMAGE:-postgis/postgis:17-3.5}
    restart: unless-stopped
    environment:
      POSTGRES_DB: farmcore
      # The owner/migrator role: owns the database, the schema and the PostGIS extension.
      # Only `migrate` and `backup` hold its password.
      POSTGRES_USER: farmcore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # No published port: only this project's services reach the database.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmcore -d farmcore"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging

  # One-shot, as the owner: upgrade the schema, set the installation id once, create or update
  # the runtime role. App and bot start only after it exits 0, and never migrate themselves.
  migrate:
    <<: *farmcore
    restart: "no"
    command: ["farmcore", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://farmcore:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/farmcore
      RUNTIME_DATABASE_ROLE: farmcore_app
      RUNTIME_DATABASE_PASSWORD: ${RUNTIME_DATABASE_PASSWORD:?set RUNTIME_DATABASE_PASSWORD in .env}
    volumes: []

  app:
    <<: *farmcore
    ports:
      - "${FARMCORE_BIND:-127.0.0.1}:${FARMCORE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Telegram long polling: one poller per bot token. Starts only with `--profile telegram`.
  bot:
    <<: *farmcore
    profiles: ["telegram"]
    command: ["farmcore", "bot"]

  # Daily pg_dump (custom format, checked with pg_restore --list), seven-day retention, into this
  # project's `backups` volume (or the host directory BACKUP_DIR, one per installation).
  # One-off backup: docker compose run --rm --no-deps -e BACKUP_ONCE=1 backup
  backup:
    image: ${POSTGIS_IMAGE:-postgis/postgis:17-3.5}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: farmcore
      PGDATABASE: farmcore
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ${BACKUP_DIR:-backups}:/backups
    stop_grace_period: 2m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        umask 077
        tmp=""
        cleanup() { [ -z "$$tmp" ] || rm -f "$$tmp"; }
        trap 'cleanup; exit 0' INT TERM
        backup_once() {
          dump="/backups/farmcore-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          tmp="$$dump.tmp"
          find /backups -maxdepth 1 -name 'farmcore-*.tmp' -mmin +60 -delete
          pg_dump -Fc -f "$$tmp" || return 1
          pg_restore --list "$$tmp" > /dev/null || return 1
          mv "$$tmp" "$$dump" || return 1
          tmp=""
          find /backups -maxdepth 1 -name 'farmcore-*.dump' -mtime +6 -delete
          echo "backup: wrote $$dump"
        }
        if [ -n "$${BACKUP_ONCE:-}" ]; then
          if backup_once; then exit 0; fi
          cleanup; exit 1
        fi
        while true; do
          if backup_once; then delay=86400; else cleanup; echo 'backup: FAILED' >&2; delay=3600; fi
          sleep "$$delay" & wait $$!
        done
    logging: *logging

volumes:
  pgdata:
  whisper-cache:
  backups:
