{# Inline stroke icons (24 px grid, drawn for farmcore, Lucide-style). `icon(name, cls)`.
   Unknown names render a small dot, so an app can name an icon the core does not have yet. #}
{% macro icon(name, cls="h-5 w-5") -%}
<svg class="{{ cls }} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "home" -%}<path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-8h6v8"/>
{%- elif name == "calendar" -%}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 11h18M7 15h2M15 15h2"/>
{%- elif name == "bell" -%}<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>
{%- elif name == "database" -%}<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/>
{%- elif name == "today" -%}<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
{%- elif name == "map" -%}<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/>

{%- elif name == "more" -%}<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>
{%- elif name == "advisor" -%}<path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/>

{%- elif name == "chart" -%}<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>

{%- elif name == "landmark" -%}<path d="M3 21h18M5 21V10M19 21V10M9 21V10M15 21V10M2 10l10-6 10 6"/>
{%- elif name == "chat" -%}<path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10Z"/>
{%- elif name == "share" -%}<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>

{%- elif name == "wait" -%}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "none" -%}<path d="M6 12h12"/>
{%- elif name == "mic" -%}<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
{%- elif name == "tractor" -%}<circle cx="7" cy="17" r="3"/><circle cx="18" cy="18" r="2"/><path d="M4 14V8h6l2 6M10 8V5h4v9h5v4M12 14h3"/>

{%- elif name == "chevron-left" -%}<path d="m15 6-6 6 6 6"/>

{%- elif name == "clock" -%}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "rain" -%}<path d="M17.5 15a4.5 4.5 0 1 0-1.3-8.8A6 6 0 1 0 6 13"/><path d="m8 17-1 3M12 17l-1 3M16 17l-1 3"/>
{%- elif name == "thermo" -%}<path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0Z"/>
{%- elif name == "wind" -%}<path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h7"/>
{%- elif name == "dry" -%}<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11Z"/><path d="M4 4l16 16"/>
{%- elif name == "humidity" -%}<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11Z"/><path d="M8.5 14.5c1.2-1 2.3-1 3.5 0s2.3 1 3.5 0"/>
{%- elif name == "check" -%}<path d="m5 12 5 5L20 7"/>
{%- elif name == "x" -%}<path d="M6 6l12 12M18 6 6 18"/>

{%- elif name == "bug" -%}<rect x="8" y="6" width="8" height="14" rx="4"/><path d="M12 10v6M3 13h5M16 13h5M4 7l4 2M20 7l-4 2M4 19l4-2M20 19l-4-2"/>
{%- else -%}<circle cx="12" cy="12" r="2.5"/>
{%- endif -%}
