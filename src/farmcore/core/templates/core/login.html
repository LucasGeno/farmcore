{% extends "core/public_auth.html" %}
{% block title %}Sign in · FarmCore{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold">Sign in to your farm</h1>
<p class="mt-3 text-muted">Use the local account provided by your installation operator.</p>
{% if error %}<p role="alert" class="mt-4 border border-line rounded-lg p-3">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="mt-6 grid gap-3">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
<label for="login">Login</label><input id="login" name="login" autocomplete="username" maxlength="128" required class="min-h-[44px] border border-line rounded-lg bg-surface px-3">
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required class="min-h-[44px] border border-line rounded-lg bg-surface px-3">
<button type="submit" class="min-h-[44px] rounded-lg bg-brand-900 hover:bg-brand-700" style="color: var(--surface)">Sign in</button>
</form>
{% endblock %}
