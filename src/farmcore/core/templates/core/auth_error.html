{% extends "core/public_auth.html" %}
{% block title %}Sign-in request refused · FarmCore{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold">Sign-in request refused</h1>
<p role="alert" class="mt-4 text-muted">{{ message }}</p>
<a href="{{ return_path }}" class="mt-4 inline-flex min-h-[44px] items-center rounded-lg border border-line bg-surface px-4 font-semibold text-ink hover:bg-ground">Back to sign-in</a>
{% endblock %}
