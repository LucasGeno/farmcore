<nav aria-label="Crop protection models" class="mb-5 flex flex-wrap gap-2">
  <a href="{{ farm_url('/advisor/?model=all') }}" {% if selected_model == 'all' %}aria-current="page"{% endif %}
     class="inline-flex min-h-[44px] items-center rounded-lg border border-line bg-surface px-3 text-sm font-semibold aria-[current=page]:bg-brand-900 aria-[current=page]:text-white">All risks</a>
  {% for m in models %}
  {% if m.enabled %}
  <a href="{{ farm_url('/advisor/?model=' ~ m.key) }}" {% if selected_model == m.key %}aria-current="page"{% endif %}
     class="inline-flex min-h-[44px] items-center rounded-lg border border-line bg-surface px-3 text-sm font-semibold aria-[current=page]:bg-brand-900 aria-[current=page]:text-white">{{ m.label }}</a>
  {% else %}
  <button type="button" disabled class="min-h-[44px] rounded-lg border border-line px-3 text-left text-sm text-muted">{{ m.label }}</button>
  {% endif %}
  {% endfor %}
</nav>
