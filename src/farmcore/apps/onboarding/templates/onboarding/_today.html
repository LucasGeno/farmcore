{% if needed %}
<section class="rounded-xl border border-line bg-surface p-4" data-farm-setup>
  <h2 class="font-semibold">Set your farm's location</h2>
  <p class="mt-1 text-sm text-muted">Home uses the farm's own time zone and country.</p>
  <a href="{{ location_url }}" class="mt-3 inline-flex min-h-[44px] items-center rounded-lg bg-brand-900 px-4 font-semibold text-white">Place the farm</a>
</section>
{% else %}
<div data-home-empty hidden></div>
{% endif %}
